name: Product quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and browser dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix test/vendor --no-audit --no-fund html2canvas@1.4.1 jspdf@2.5.1
          npx playwright install --with-deps chromium
      - name: Build portfolio demo
        run: npm run build
      - name: Verify generated Pages demo matches source
        run: cmp dist/index.html docs/index.html
      - name: Validate recorded model outputs
        run: npm run check:recorded
      - name: Regression tests
        run: npm run test:regressions
      - name: Browser journeys
        run: npm run test:journeys
      - name: Re-score synthetic evaluations
        run: python eval/score.py
